<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صوري · AN TV</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#150d22;color:#fff;font-family:system-ui,sans-serif;padding:16px;box-sizing:border-box}.card{width:min(100%,560px);box-sizing:border-box;padding:28px;border:1px solid #a985c5;border-radius:28px;background:linear-gradient(145deg,#594369ba,#25162dbb);box-shadow:0 20px 80px #0005}h1{font-size:2rem;margin:0 0 14px;color:#efdcff}p{line-height:1.8}input{display:block;width:100%;margin:22px 0}button,a.button{display:block;width:100%;box-sizing:border-box;border:0;border-radius:16px;padding:15px;background:#d7b2ef;color:#24102e;font:700 1rem system-ui;text-align:center;text-decoration:none;cursor:pointer}.muted{color:#d5c5df;font-size:.9rem}.error{color:#ffb8c2}</style>
<main class="card"><h1>صوري · AN TV</h1><p>اختر حتى ١٠ صور من معرض جوالك، وأرسلها مباشرة إلى التلفزيون.</p><p id="status">اضغط «اتصال بالتلفزيون» للبدء.</p><button id="connect">اتصال بالتلفزيون</button><section id="upload" hidden><p id="count"></p><input id="files" type="file" accept="image/*" multiple><button id="send">إرسال الصور</button><p id="result"></p></section><p class="muted">يبقى التلفزيون على شاشة «صوري» أثناء الإرسال. الصور لا تُرفع إلى هذا الموقع؛ الاتصال يتم داخل شبكة الواي فاي.</p><a class="button" id="direct" hidden>فتح الصفحة المحلية مباشرة</a></main>
<script>
const hash=new URLSearchParams(location.hash.slice(1)),tv=hash.get('tv'),key=hash.get('key');
const status=document.getElementById('status'),count=document.getElementById('count'),result=document.getElementById('result'),upload=document.getElementById('upload');
const valid=tv&&/^\d{1,3}(\.\d{1,3}){3}:\d{1,5}$/.test(tv)&&/^[0-9a-f]{32}$/.test(key);
const base=valid?'http://'+tv+'/':'';function url(path){return base+path+'?key='+key}
const direct=document.getElementById('direct');if(valid){direct.href=url('/');direct.hidden=false}
async function request(path,options={}){return fetch(url(path),{mode:'cors',targetAddressSpace:'local',cache:'no-store',...options})}
async function refresh(){const r=await request('/count');if(!r.ok)throw Error('تعذر قراءة عدد الصور');count.textContent='الصور المحفوظة: '+await r.text()+' من 10'}
document.getElementById('connect').onclick=async()=>{if(!valid){status.textContent='رمز QR غير مكتمل. افتح «صوري» على التلفزيون وامسح الرمز من جديد.';return}status.textContent='جارٍ الاتصال…';try{await refresh();status.textContent='التلفزيون متصل';upload.hidden=false;document.getElementById('connect').hidden=true}catch(e){status.className='error';status.textContent='تعذر الاتصال. تأكد أن «صوري» مفتوحة وأن الجوال والتلفزيون على نفس الواي فاي. إذا ظهر طلب سماح من المتصفح، اختر «سماح». ثم اضغط اتصال مجددًا.'}};
async function jpeg(file){const img=await createImageBitmap(file),k=Math.min(1,1920/img.width,1080/img.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close();return new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
document.getElementById('send').onclick=async()=>{const fs=[...document.getElementById('files').files];if(!fs.length){result.textContent='اختر صورة أولًا';return}if(fs.length>10){result.textContent='الحد الأقصى 10 صور';return}let current=Number((await(await request('/count')).text()));if(current+fs.length>10){result.textContent='المتاح '+(10-current)+' صور فقط';return}let n=0;for(const f of fs)try{const b=await jpeg(f);if(!b||b.size>3145728)throw Error('الصورة كبيرة جدًا');const r=await request('/upload',{method:'POST',headers:{'Content-Type':'image/jpeg'},body:b});if(!r.ok)throw Error(await r.text());result.textContent='تم إرسال '+(++n)+' من '+fs.length;await refresh()}catch(e){result.className='error';result.textContent='توقف الإرسال: '+e.message;break}};
</script></html>
