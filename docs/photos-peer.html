<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>صوري · AN TV</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#150d22;color:#fff;font-family:system-ui,sans-serif;padding:16px;box-sizing:border-box}.card{width:min(100%,560px);box-sizing:border-box;padding:28px;border:1px solid #a985c5;border-radius:28px;background:linear-gradient(145deg,#594369ba,#25162dbb);box-shadow:0 20px 80px #0005}h1{font-size:2rem;margin:0 0 14px;color:#efdcff}p{line-height:1.8}input{display:block;width:100%;margin:22px 0}button{display:block;width:100%;box-sizing:border-box;border:0;border-radius:16px;padding:15px;background:#d7b2ef;color:#24102e;font:700 1rem system-ui;text-align:center;cursor:pointer}button:disabled{opacity:.5}.muted{color:#d5c5df;font-size:.9rem}.error{color:#ffb8c2}</style>
<main class="card"><h1>صوري · AN TV</h1><p>اختر حتى ١٠ صور من معرض جوالك، وأرسلها إلى التلفزيون.</p><p id="status">جاهز لاختيار الصور</p><p id="count"></p><input id="files" type="file" accept="image/*" multiple><button id="send">إرسال الصور</button><p id="result"></p><p class="muted">اترك شاشة «صوري» مفتوحة على التلفزيون حتى تظهر الصور. يلزم الإنترنت للجوال والتلفزيون. تُشفّر الصور على الجوال قبل نقلها عبر خدمة مؤقتة، ولا تُحفظ في صفحة الشرح.</p></main>
<script>
const id=location.hash.slice(1),status=document.getElementById('status'),result=document.getElementById('result'),send=document.getElementById('send');
if(!/^antv-[0-9a-f]{32}$/.test(id)){status.textContent='امسح رمز QR الجديد من شاشة «صوري» على التلفزيون';send.disabled=true}
async function jpeg(file){const img=await createImageBitmap(file),k=Math.min(1,1920/img.width,1080/img.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*k));c.height=Math.max(1,Math.round(img.height*k));c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close();return new Uint8Array(await(await new Promise(r=>c.toBlob(r,'image/jpeg',.8))).arrayBuffer())}
function keyBytes(){const h=id.slice(5);return Uint8Array.from(h.match(/../g),v=>parseInt(v,16))}
send.onclick=async()=>{const fs=[...document.getElementById('files').files];if(!fs.length){result.textContent='اختر صورة أولًا';return}if(fs.length>10){result.textContent='الحد الأقصى 10 صور';return}send.disabled=true;result.className='';let n=0;try{const key=await crypto.subtle.importKey('raw',keyBytes(),'AES-GCM',false,['encrypt']);for(const f of fs){status.textContent='جارٍ تجهيز الصورة '+(n+1)+' من '+fs.length;const bytes=await jpeg(f);if(bytes.length>1800000)throw Error('الصورة كبيرة جدًا بعد تصغيرها');const iv=crypto.getRandomValues(new Uint8Array(12));const ciphertext=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));const payload=new Uint8Array(iv.length+ciphertext.length);payload.set(iv);payload.set(ciphertext,iv.length);status.textContent='جارٍ إرسال الصورة '+(n+1)+' من '+fs.length;const response=await fetch('https://ntfy.sh/'+id,{method:'POST',headers:{'Filename':'photo.enc','Content-Type':'application/octet-stream'},body:payload});if(!response.ok)throw Error('فشل الإرسال ('+response.status+')');n++;result.textContent='تم رفع '+n+' من '+fs.length+' · انتظر ظهورها على التلفزيون'}status.textContent='اكتمل الإرسال'}catch(e){result.className='error';result.textContent='تعذر الإرسال: '+(e.message||'اتصال الشبكة')}send.disabled=false};
</script></html>
